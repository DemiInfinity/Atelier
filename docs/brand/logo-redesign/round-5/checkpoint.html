<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:#1b1b1b;background:#f4f3ef}
header{padding:18px 24px;background:#fff;border-bottom:1px solid #e4e2dc}h1{margin:0;font-size:20px}
.sub{color:#6d6d6d;font-size:13px}h2{font-size:18px;margin:30px 0 6px}h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:#6d6d6d;margin:18px 0 8px}
.wrap{padding:0 24px 40px}.row{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end}.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.cap{font-size:11px;color:#6d6d6d;text-align:center}
.ic{display:block;overflow:hidden;background:#ddd}.ic img{width:100%;height:100%;display:block;object-fit:cover}
.phone{width:300px;padding:44px 18px 26px;border-radius:44px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px}
.phone .app{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px}
.light{background:linear-gradient(160deg,#ffd9c2,#c9d8ff 55%,#e9e1ff)}.light .app{color:#222}
.dark{background:linear-gradient(160deg,#141821,#272033 60%,#0d0f14)}.dark .app{color:#eee}
.me{outline:2px dashed rgba(255,80,80,.0)}
.dock{display:inline-flex;gap:8px;padding:8px 10px;border-radius:22px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 30px rgba(0,0,0,.15)}
.deskbg{padding:60px 30px 18px;border-radius:14px;background:linear-gradient(135deg,#7a8fb8,#c99aa8)}
.taskbar{display:inline-flex;gap:6px;align-items:center;padding:6px 14px;border-radius:10px;background:#202020}
.taskbar .slot{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:6px}
.taskbar .slot.on{background:#3a3a3a}
.tab{display:flex;align-items:center;gap:8px;width:260px;padding:8px 12px;border-radius:10px 10px 0 0;background:#fff;border:1px solid #ddd;font-size:12px}
.tabdark{background:#2b2b2b;color:#eee;border-color:#444}
.notif{display:flex;gap:10px;align-items:center;width:340px;padding:12px;border-radius:20px;background:rgba(255,255,255,.75);border:1px solid #e3e3e3;font-size:12px}
.notif b{display:block}
.mode{width:120px;height:120px;border-radius:26px;display:flex;align-items:center;justify-content:center}
.maskbox{position:relative;width:140px;height:140px}
.safe{position:absolute;border:2px dashed #ff4d4d;pointer-events:none}
.menubar{display:flex;align-items:center;justify-content:flex-end;gap:14px;width:340px;height:24px;padding:0 10px;font-size:12px}
