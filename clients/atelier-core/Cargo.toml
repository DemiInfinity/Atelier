[package]
name = "atelier-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
directories = "6.0.0"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = { version = "0.3.41", features = ["parsing", "formatting", "macros"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "sync", "fs"] }
toml = "1.0.7"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
