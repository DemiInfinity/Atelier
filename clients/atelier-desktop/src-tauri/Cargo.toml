[package]
name = "atelier-desktop"
description = "Atelier Desktop: your studio's companion on this machine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "atelier_desktop"
path = "src/lib.rs"

[[bin]]
name = "atelier-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atelier-core = { version = "0.1.0", path = "../../atelier-core" }
gethostname = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
time = { version = "0.3.41", features = ["parsing", "formatting", "macros", "local-offset"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "process", "fs"] }
toml = "1.0.7"
url = "2"

[dev-dependencies]
axum = "0.8"
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
wiremock = "0.6.5"

[lints]
workspace = true
