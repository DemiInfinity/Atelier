name: image

# On every push to main, on the server's Linux runner:
#   1. test (in a Go container),
#   2. build Atelier's image and the runner image, and push both to Atelier's
#      own registry (atelier.infinityhomelab.lan/demiinfinity/…), so Portainer
#      can pull them; they are also tagged atelier:latest and
#      atelier-runner:latest on the server, which the stacks use today,
#   3. ask Watchtower to update Atelier to the new image (the stack runs
#      $IMAGE:latest; Watchtower would otherwise pick it up on its daily run).
# Runners then update themselves to the build inside that image once they are
# idle (Settings → Runners), including the one running this job, so its own
# container is never recreated mid-job.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: atelier.infinityhomelab.lan
  IMAGE: atelier.infinityhomelab.lan/demiinfinity/atelier
  RUNNER_IMAGE: atelier.infinityhomelab.lan/demiinfinity/atelier-runner

jobs:
  test:
    runs-on: [linux, docker]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Vet and test
        # The workspace has the same path on the host, so the Go container can
        # mount it; module and build caches persist in named volumes. The
        # server has 8 GB shared with everything else, so the container is
        # capped at 3 GB and packages test one at a time. internal/web is left
        # out for now: its tests hold on to memory (9 GB and climbing) and
        # were killed; run them before pushing until that's fixed.
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" --memory 3g -e GOMEMLIMIT=2GiB \
            -v atelier-ci-gomod:/go/pkg/mod -v atelier-ci-gobuild:/root/.cache/go-build \
            golang:1.27 sh -c 'git config --global --add safe.directory "*" && go vet ./... &&
              go test -p 1 -timeout 20m $(go list ./... | grep -v "^atelier/internal/web$")'

  build:
    name: build, push and deploy
    needs: test
    runs-on: [linux, docker]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Atelier's registry
        env:
          TOKEN: ${{ secrets.ATELIER_TOKEN }}
        run: echo "$TOKEN" | docker login "$REGISTRY" -u atelier --password-stdin

      - name: Build
        run: |
          short=$(echo "$GITHUB_SHA" | cut -c1-7)
          docker build --build-arg VERSION="$short" -t "$IMAGE:$short" -t "$IMAGE:latest" -t atelier:latest .
          docker build --build-arg VERSION="$short" --target runner \
            -t "$RUNNER_IMAGE:$short" -t "$RUNNER_IMAGE:latest" -t atelier-runner:latest .
          echo "short=$short" >> "$GITHUB_ENV"

      - name: Push
        run: |
          for i in "$IMAGE:$short" "$IMAGE:latest" "$RUNNER_IMAGE:$short" "$RUNNER_IMAGE:latest"; do docker push "$i"; done

      - name: Tell Watchtower to update Atelier now
        # Atelier's stack runs $IMAGE:latest and lets Watchtower manage it, so
        # Watchtower pulls the image pushed above and recreates the container.
        # Its daily run would do the same; this asks it now, over its HTTP API
        # (reached through Watchtower's own network, so no port is needed).
        # The API token is read from the Watchtower container at run time and
        # masked, so it is never stored in Atelier or shown in the log.
        # Atelier is down for a few seconds; this runner retries its reports.
        run: |
          token=$(docker inspect watchtower --format '{{range .Config.Env}}{{println .}}{{end}}' | sed -n 's/^WATCHTOWER_HTTP_API_TOKEN=//p')
          [ -n "$token" ] || { echo "::error::No Watchtower HTTP API token found on the watchtower container"; exit 1; }
          echo "::add-mask::$token"
          want=$(docker image inspect "$IMAGE:latest" --format '{{.Id}}')
          docker run --rm --network container:watchtower curlimages/curl:8.11.1 -fsS --max-time 600 \
            -H "Authorization: Bearer $token" "http://localhost:8080/v1/update?image=$IMAGE"
          for i in $(seq 1 60); do
            if [ "$(docker inspect atelier --format '{{.Image}}' 2>/dev/null)" = "$want" ] &&
               [ "$(docker inspect atelier --format '{{.State.Health.Status}}' 2>/dev/null)" = healthy ]; then
              echo "Atelier $short is up"; exit 0
            fi
            sleep 3
          done
          echo "::error::Atelier isn't running $IMAGE:$short (healthy) after Watchtower's update"
          docker ps --filter name=^/atelier$ --format '{{.Image}} {{.Status}}'
          exit 1

      - name: Log out
        if: always()
        run: docker logout "$REGISTRY" || true
