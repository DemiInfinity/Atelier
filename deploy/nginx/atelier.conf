# Atelier behind nginx — drop into /etc/nginx/conf.d/ (http context).
# Replace git.example.com and the certificate paths with your own.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream atelier {
    # Atelier container on your Portainer host. If nginx runs in the same
    # Docker network, use the service name instead, e.g. "atelier:3000".
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name git.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name git.example.com;

    ssl_certificate     /etc/ssl/certs/git.example.com.pem;
    ssl_certificate_key /etc/ssl/private/git.example.com.key;

    # git pushes can be large; never cap them
    client_max_body_size 0;

    location / {
        proxy_pass http://atelier;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # live Actions logs, runner connections and MCP streaming
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # stream git pack data instead of buffering it
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }
}
